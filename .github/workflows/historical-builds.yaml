    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Checkout Upstream repo
        uses: actions/checkout@v7
        with:
          repository: simulot/immich-go
          ref: ${{ matrix.tag }}
      - name: Setup ko
        uses: ko-build/setup-ko@v0.10
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
           .ko.yaml
          sparse-checkout-cone-mode: false
          path: immich-go-docker
      - name: Install crane
        uses: imjasonh/setup-crane@v0.7
      - name: Build image
        id: build
        env:
          KO_DOCKER_REPO: ghcr.io/userbradley/${{env.IMAGE_NAME}}
          KO_CONFIG_PATH: immich-go-docker/.ko.yaml
          TAG: ${{matrix.tag}}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | ko login ghcr.io -u ${{ github.actor }} --password-stdin
          STRIPPED_TAG="${TAG#v}"
          ko build --bare -t "${{ env.TAG }}" -t "${STRIPPED_TAG}"  --image-label org.opencontainers.image.source=https://github.com/userbradley/immich-go-docker --image-label org.opencontainers.image.description="Docker image version of https://github.com/simulot/immich-go" --image-annotation org.opencontainers.image.description="Docker image version of https://github.com/simulot/immich-go" --sbom=none)
