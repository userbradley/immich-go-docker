name: "Build latest version"
# DESCRIPTION: This CI builds the latest tagged version of Immich-go
on:
  push:
    paths:
      - .github/workflows/build.yaml # Only to build when this file is changed
env:
  TAG: v0.32.0
  IMAGE_NAME: immich-go-docker
jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      index_digest: ${{ steps.build.outputs.index_digest }}
      arch_digests: ${{ steps.build.outputs.arch_digests }}
    steps:
      - name: Checkout Upstream repo
        uses: actions/checkout@v7
        with:
          repository: simulot/immich-go
          ref: ${{ env.TAG }}
      - name: List the files (validate above worked)
        shell: bash
        run: ls
      - name: Setup ko
        uses: ko-build/setup-ko@v0.10
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
           .ko.yaml
          sparse-checkout-cone-mode: false
          path: immich-go-docker
      - name: Install crane
        uses: imjasonh/setup-crane@v0.7
      - name: Build image
        id: build
        env:
          KO_DOCKER_REPO: ghcr.io/userbradley/${{env.IMAGE_NAME}}
          KO_CONFIG_PATH: immich-go-docker/.ko.yaml
        # Something we're doing below is using KO to get the index manifest, and then we sign it all
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | ko login ghcr.io -u ${{ github.actor }} --password-stdin
          
          STRIPPED_TAG="${TAG#v}"
          
          KO_OUTPUT=$(ko build --bare -t latest -t "${{ env.TAG }}" -t "${STRIPPED_TAG}" --image-label org.opencontainers.image.source=https://github.com/userbradley/immich-go-docker --sbom=none)
          
          INDEX_DIGEST="${KO_OUTPUT#*@}"
          
          ARCH_DIGESTS=$(crane manifest "${{ env.KO_DOCKER_REPO }}@${INDEX_DIGEST}" | jq -c '[.manifests[].digest]')
          
          echo "image=${{ env.KO_DOCKER_REPO }}" >> "$GITHUB_OUTPUT"
          echo "index_digest=${INDEX_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "arch_digests=${ARCH_DIGESTS}" >> "$GITHUB_OUTPUT"
  provenance:
    name: SLSA Provenance
    needs: build
    permissions:
      id-token: write
      contents: read
      actions: read
      packages: write
    strategy:
      matrix:
        # Loop over each architecture's digest
        digest: ${{ fromJSON(needs.build.outputs.arch_digests) }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ matrix.digest }}
      registry-username: ${{ github.actor }}
      compile-generator: false # Speeds up workflow by around 2min
      private-repository: false # Push to the transparency log
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
  sbom:
    name: SBOM Attestation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    strategy:
      matrix:
        digest: ${{ fromJSON(needs.build.outputs.arch_digests) }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.build.outputs.image }}@${{ matrix.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Attach SBOM attestation
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type https://spdx.dev/Document \
            --predicate sbom.spdx.json \
            "${IMAGE}@${DIGEST}"
  sign:
    name: Cosign Image Signature
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign image recursively
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          INDEX_DIGEST: ${{ needs.build.outputs.index_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${IMAGE}@${INDEX_DIGEST}"
